services:
  mysql:
    image: mysql:8.0.42
    container_name: 9900-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
    networks:
      - my-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  database-migrations:
    image: redgate/flyway:13.9.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      FLYWAY_SCHEMAS: project_contest_platform
      FLYWAY_USER: ${MYSQL_USER:-root}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:-root}
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - ./database/migrations:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - my-network

  redis:
    image: redis:7.4.3
    container_name: 9900-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - my-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0.7-management
    container_name: 9900-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - my-network
    healthcheck:
      # The CLI may create .erlang.cookie during startup. Use the same UID as
      # the server so a health probe cannot create an unreadable root-owned file.
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: 9900-nacos
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:8849:8080"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - TZ=UTC
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_ADMIN_ENABLE=true
      - NACOS_AUTH_CONSOLE_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?Set a unique Base64-encoded Nacos signing key in .env}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:?Set NACOS_AUTH_IDENTITY_KEY in .env}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE in .env}
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v3/console/health/readiness >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  nacos-bootstrap:
    image: python:3.13-alpine
    command: ["python", "-B", "/bootstrap.py"]
    environment:
      NACOS_SERVER_URL: http://nacos:8848
      NACOS_ADMIN_PASSWORD: ${NACOS_ADMIN_PASSWORD:?Set the existing or initial Nacos admin password in .env}
      NACOS_USERNAME: ${NACOS_USERNAME:-competition-platform}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Set a separate Nacos discovery account password in .env}
    volumes:
      - ./infra/nacos/bootstrap.py:/bootstrap.py:ro
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - my-network
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio:
    # MinIO CE images were removed upstream. This local verification image uses
    # checksummed official source; public deployments require maintained S3.
    image: competition-platform/minio-source:release-2025-10-15
    pull_policy: build
    build:
      context: ./infra/minio
      dockerfile: Dockerfile
    container_name: 9900-minio
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    command: server /data --console-address ":9001"
    networks:
      - my-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:3
    container_name: 9900-zipkin
    ports:
      - "127.0.0.1:9411:9411"
    networks:
      - my-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Backend Services ─────────────────────────────────────────────────────────

  backend-api-gateway:
    container_name: backend-api-gateway
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:?Set independent SERVICE_JWT_SECRET in .env}
      - NACOS_USERNAME=${NACOS_USERNAME:-competition-platform}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?Set a separate Nacos discovery account password in .env}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # The gateway publishes no events, but spring-boot-starter-amqp is on its
      # classpath via common-lib, so Actuator health-checks the broker anyway.
      # Without these it authenticates as guest/guest, and any non-default
      # RABBITMQ_PASSWORD leaves the container permanently unhealthy — which
      # reads as "the gateway is broken" when nothing is actually wrong with it.
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    networks:
      - my-network
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend-user-service:
    container_name: backend-user-service
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    networks:
      - my-network
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:?Set independent SERVICE_JWT_SECRET in .env}
      - NACOS_USERNAME=${NACOS_USERNAME:-competition-platform}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?Set a separate Nacos discovery account password in .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_AUTH=${MAIL_AUTH:-true}
      - MAIL_STARTTLS_ENABLE=${MAIL_STARTTLS_ENABLE:-true}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL:-http://localhost:8080}
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend-competition-service:
    container_name: backend-competition-service
    build:
      context: .
      dockerfile: backend/competition-service/Dockerfile
    environment:
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:?Set independent SERVICE_JWT_SECRET in .env}
      - NACOS_USERNAME=${NACOS_USERNAME:-competition-platform}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?Set a separate Nacos discovery account password in .env}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    networks:
      - my-network
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend-file-service:
    container_name: backend-file-service
    build:
      context: .
      dockerfile: backend/file-service/Dockerfile
    environment:
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minio}}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minio123}}
      - MINIO_REGION=${MINIO_REGION:-}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:?Set independent SERVICE_JWT_SECRET in .env}
      - NACOS_USERNAME=${NACOS_USERNAME:-competition-platform}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?Set a separate Nacos discovery account password in .env}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio123}
    networks:
      - my-network
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend-registration-service:
    container_name: backend-registration-service
    build:
      context: .
      dockerfile: backend/registration-service/Dockerfile
    environment:
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:?Set independent SERVICE_JWT_SECRET in .env}
      - NACOS_USERNAME=${NACOS_USERNAME:-competition-platform}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?Set a separate Nacos discovery account password in .env}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    networks:
      - my-network
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend-interaction-service:
    container_name: backend-interaction-service
    build:
      context: .
      dockerfile: backend/interaction-service/Dockerfile
    environment:
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:?Set independent SERVICE_JWT_SECRET in .env}
      - NACOS_USERNAME=${NACOS_USERNAME:-competition-platform}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?Set a separate Nacos discovery account password in .env}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
    networks:
      - my-network
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend-judge-service:
    container_name: backend-judge-service
    build:
      context: .
      dockerfile: backend/judge-service/Dockerfile
    environment:
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:?Set independent SERVICE_JWT_SECRET in .env}
      - NACOS_USERNAME=${NACOS_USERNAME:-competition-platform}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?Set a separate Nacos discovery account password in .env}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    networks:
      - my-network
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend-web:
    container_name: frontend-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    networks:
      - my-network
    mem_limit: 256m
    cpus: 1.0
    depends_on:
      - backend-api-gateway
      - backend-user-service
      - backend-competition-service
      - backend-file-service
      - backend-registration-service
      - backend-interaction-service
      - backend-judge-service

  jenkins:
    image: jenkins/jenkins:jdk21
    container_name: jenkins
    user: root
    privileged: true
    ports:
      - "8888:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    networks:
      - my-network
    restart: always
    # Optional CI server — excluded from the default stack so `docker-compose up`
    # only runs the platform. Start it explicitly with: docker compose --profile ci up -d
    profiles: ["ci"]

# Named volumes rather than ./.foo-data bind mounts.
#
# A bind mount hands the container a Windows or macOS filesystem, which cannot
# represent the ownership and modes these images require. RabbitMQ was the one
# that broke outright: Erlang writes .erlang.cookie as mode 0400, a Windows
# checkout stored it 0444 read-only, `rm -rf` could not remove it, and every
# later start died with "Error when reading /var/lib/rabbitmq/.erlang.cookie:
# eacces" before the broker booted — taking all seven backend services with it,
# since they wait on it being healthy.
#
# Named volumes live inside Docker's own Linux VM, so permissions behave, I/O is
# markedly faster, and `docker compose down -v` is a complete reset.
volumes:
  jenkins_home:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  minio-data:

networks:
  my-network:
