server:
  port: 8083

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  # file-service stores objects in MinIO. It has no database, no queue and no
  # cache, but inherits mybatis-plus through common-lib and AMQP plus Redis
  # through the parent POM. Left alone, the DataSource failed to build ("Failed
  # to determine a suitable driver class") and the service exited before it
  # finished starting; Redis then fell back to localhost and blocked the health
  # endpoint long enough for the container healthcheck to time out.
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
  application:
    name: file-service
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: public
        username: ${NACOS_USERNAME:competition-platform}
        password: ${NACOS_PASSWORD:}

minio:
  internal-endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:minio}}
  secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:minio123}}
  region: ${MINIO_REGION:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
