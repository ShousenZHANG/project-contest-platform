server:
  port: 8080

spring:
  # The gateway routes requests. It publishes and consumes nothing, but the
  # parent POM puts spring-boot-starter-amqp on every module's classpath, so
  # Actuator health-checked a broker at the default localhost:5672 and held the
  # container DOWN permanently.
  autoconfigure:
    exclude:
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
  application:
    name: api-gateway
  data:
    redis:
      host: redis
      port: 6379
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
          max-wait: 5000
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: public
        username: ${NACOS_USERNAME:competition-platform}
        password: ${NACOS_PASSWORD:}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: user-docs
              uri: lb://user-service
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - StripPrefix=1
            - id: competition-docs
              uri: lb://competition-service
              predicates:
                - Path=/competition-service/v3/api-docs
              filters:
                - StripPrefix=1
            - id: registration-docs
              uri: lb://registration-service
              predicates:
                - Path=/registration-service/v3/api-docs
              filters:
                - StripPrefix=1
            - id: interaction-docs
              uri: lb://interaction-service
              predicates:
                - Path=/interaction-service/v3/api-docs
              filters:
                - StripPrefix=1
            - id: judge-docs
              uri: lb://judge-service
              predicates:
                - Path=/judge-service/v3/api-docs
              filters:
                - StripPrefix=1
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users/**
            - id: competition-service
              uri: lb://competition-service
              predicates:
                - Path=/competitions/**
            - id: file-service
              uri: lb://file-service
              predicates:
                - Path=/files/**
            - id: registration-service
              uri: lb://registration-service
              predicates:
                - Path=/registrations/**
            - id: submission-routes
              uri: lb://registration-service
              predicates:
                - Path=/submissions/**
            - id: interaction-service
              uri: lb://interaction-service
              predicates:
                - Path=/interactions/**
            - id: team-routes
              uri: lb://user-service
              predicates:
                - Path=/teams/**
            - id: judge-service
              uri: lb://judge-service
              predicates:
                - Path=/judges/**
            - id: winners-routes
              uri: lb://judge-service
              predicates:
                - Path=/winners/**
            - id: dashboard-service
              uri: lb://judge-service
              predicates:
                - Path=/dashboard/**
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  public-urls:
    - /user-service/v3/api-docs
    - /competition-service/v3/api-docs
    - /registration-service/v3/api-docs
    - /interaction-service/v3/api-docs
    - /judge-service/v3/api-docs
    - /users/oauth/github
    - /users/oauth/callback/github
    - /users/oauth/google
    - /users/oauth/callback/google
    - /users/register
    - /users/login
    - /users/forgot-password
    - /users/reset-password
    - GET:/competitions/list
    - GET:/competitions/public/**
    - GET:/competitions/*
    - /submissions/public/approved
    - GET:/submissions/public/*/download
    - /submissions/is-organizer
    - /interactions/comments/list
    - /interactions/votes/count
    - /teams/public/*
    - /registrations/public/**
    - /submissions/public/teams/**
    - /winners/public-list
    - /dashboard/public/**

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /doc.html
    disable-swagger-default-url: true
    urls:
      - name: User-Service
        url: /user-service/v3/api-docs
      - name: Competition-Service
        url: /competition-service/v3/api-docs
      - name: Registration-Service
        url: /registration-service/v3/api-docs
      - name: Interaction-Service
        url: /interaction-service/v3/api-docs
      - name: Judge-Service
        url: /judge-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
