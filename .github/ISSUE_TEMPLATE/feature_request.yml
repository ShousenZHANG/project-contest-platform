name: Feature request
description: Propose a capability the platform does not have yet.
labels: [enhancement, needs-triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - frontend (React app)
        - api-gateway
        - user-service
        - competition-service
        - file-service
        - registration-service
        - interaction-service
        - judge-service
        - infrastructure (Docker, MySQL, Redis, RabbitMQ, Nacos, MinIO)
        - docs
        - not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >
        What can someone not do today? Describe the situation, not the
        solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should happen instead, from the user's point of view.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This changes the database schema (`mysql-init/create_table.sql`)
        - label: This adds or changes a cross-service contract (Feign client, queue, gateway route)
        - label: This needs an ADR under `docs/adr/`
