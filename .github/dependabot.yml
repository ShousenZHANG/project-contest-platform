version: 2

# Grouping policy: every group is restricted to minor and patch updates, so a
# major bump always arrives as its own PR.
#
# The first run without that restriction produced PRs that buried a major
# upgrade inside a pile of harmless patches — react-router 6 -> 7 rode along
# with three React patch releases, TypeScript 5 -> 7 with a Vite minor, and
# Jest 29 -> 30 with the rest of the test tooling. Each of those needs its own
# review, and bundling them forces an all-or-nothing decision on the whole group.

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: chore
      include: scope
    groups:
      spring:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns:
          - org.springframework*
          - com.alibaba.cloud*
      test-tooling:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns:
          - org.junit*
          - org.mockito*
          - org.assertj*
          - org.wiremock*
          - org.jacoco*

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: chore
      include: scope
    groups:
      react:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns:
          - react
          - react-dom
          - react-router-dom
          - '@types/react*'
      radix:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns:
          - '@radix-ui/*'
      build-tooling:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns:
          - vite
          - '@vitejs/*'
          - '@tailwindcss/*'
          - tailwindcss
          - typescript
      test-tooling:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns:
          - jest
          - jest-*
          - babel-jest
          - '@testing-library/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: chore
      include: scope
